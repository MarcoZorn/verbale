[project]
name = "verbale"
version = "0.1.0"
description = "Meeting notes that never leave your machine. Records, transcribes and summarises locally."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marco Zorn", email = "m@zorn.it" }]
requires-python = ">=3.9"
keywords = ["meeting-notes", "whisper", "transcription", "local-first", "privacy", "ollama", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business",
]
dependencies = [
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://marcozorn.github.io/verbale/"
Source = "https://github.com/MarcoZorn/verbale"
Issues = "https://github.com/MarcoZorn/verbale/issues"

[project.scripts]
verbale = "verbale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verbale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
