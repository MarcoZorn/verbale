<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbale</title>
<style>
  :root {
    --bg:#0e0f13; --panel:#14161c; --line:#232733; --ink:#e6e8ee; --dim:#8b93a7;
    --accent:#ff8a5c; --green:#5ac8a0; --blue:#6ea8ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .logo { font-weight:650; letter-spacing:-.02em; font-size:15px; }
  .logo b { color:var(--accent); }
  .tag { font-size:11.5px; color:var(--dim); }
  header input { margin-left:auto; background:var(--panel); border:1px solid var(--line); color:var(--ink);
                 border-radius:7px; padding:7px 11px; font:inherit; font-size:12.5px; width:230px; max-width:40vw; }
  header input:focus { outline:none; border-color:#39405a; }
  main { flex:1; display:grid; grid-template-columns:320px minmax(0,1fr); min-height:0; min-width:0; }
  #list { border-right:1px solid var(--line); overflow-y:auto; min-width:0; }
  .item { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#12141a; }
  .item[aria-selected="true"] { background:#181b23; box-shadow:inset 3px 0 0 var(--accent); }
  .item .name { font-size:13.5px; font-weight:550; margin-bottom:3px; }
  .item .meta { font-size:11px; color:var(--dim); display:flex; gap:9px; align-items:center; }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .s-summarised { background:var(--green);} .s-transcribed { background:var(--accent);}
  .s-recorded { background:var(--dim);} .s-empty { background:#e8615c;}
  #detail { overflow-y:auto; padding:26px 34px 70px; min-width:0; overflow-wrap:anywhere; }
  #detail h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; display:flex; gap:12px; flex-wrap:wrap; }
  audio { width:100%; max-width:560px; margin-bottom:20px; filter:invert(.92) hue-rotate(180deg); }
  .tabs { display:flex; gap:6px; margin-bottom:18px; }
  .tabs button { font:inherit; font-size:12px; padding:6px 13px; border-radius:7px; cursor:pointer;
                 background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#16110e; border-color:var(--accent); }
  .notes { max-width:760px; line-height:1.65; font-size:14px; }
  .notes h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
              margin:26px 0 10px; font-weight:650; }
  .notes ul { padding-left:20px; margin:8px 0; } .notes li { margin:5px 0; }
  .notes p { margin:9px 0; }
  .turn { display:flex; gap:14px; padding:9px 0; border-bottom:1px solid #1a1d25; max-width:820px; }
  .turn .who { flex:0 0 76px; font-size:11.5px; font-weight:600; padding-top:1px; }
  .turn .who.them { color:var(--blue); } .turn .who.you { color:var(--accent); }
  .turn .t { flex:0 0 46px; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums;
             cursor:pointer; padding-top:2px; }
  .turn .txt { font-size:13.5px; line-height:1.6; }
  mark { background:rgba(255,138,92,.3); color:inherit; border-radius:2px; }
  .empty { color:var(--dim); font-size:13px; padding:60px 0; text-align:center; }
  code { background:#1b1e26; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  @media (max-width:760px){ main{grid-template-columns:1fr} #list{max-height:36vh} }
</style>
</head>
<body>
<header>
  <span class="logo">Ver<b>bale</b></span>
  <span class="tag">nothing here has left this machine</span>
  <input id="q" type="search" placeholder="search transcripts" autocomplete="off">
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a meeting</div></div>
</main>

<script>
const $ = s => document.querySelector(s);
let meetings = [], current = null, tab = "notes", query = "";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60;
  return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}:${String(r).padStart(2,"0")}`
                 : `${m}:${String(r).padStart(2,"0")}`; };

function highlight(text) {
  const safe = esc(text);
  if (!query) return safe;
  return safe.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
}

// Just enough Markdown for what the summariser emits. A parser library would
// be larger than this whole page.
function md(src) {
  const lines = src.split("\n"); let out = [], list = false;
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
  for (let line of lines) {
    if (/^#\s/.test(line)) continue;                      // the title is shown above
    if (/^##\s/.test(line)) { if (list) { out.push("</ul>"); list = false; }
      out.push(`<h2>${inline(line.replace(/^##\s*/, ""))}</h2>`); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) {
      if (!list) { out.push("<ul>"); list = true; }
      let body = li[1].replace(/^\[( |x)\]\s*/i, (_, c) => c.toLowerCase() === "x" ? "✓ " : "☐ ");
      out.push(`<li>${inline(body)}</li>`); continue;
    }
    if (list) { out.push("</ul>"); list = false; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

async function load() {
  meetings = await (await fetch("/api/meetings")).json();
  renderList();
  if (meetings.length && !current) select(meetings[0].id);
  if (!meetings.length) $("#detail").innerHTML =
    `<div class="empty">No meetings yet.<br><br><code>verbale record "Standup"</code></div>`;
}

function renderList() {
  $("#list").innerHTML = meetings.map(m => `
    <div class="item" data-id="${m.id}" aria-selected="${current && current.brief.id === m.id}">
      <div class="name">${esc(m.name)}</div>
      <div class="meta">
        <span class="dot s-${m.status}"></span>
        <span>${m.id.slice(0, 16).replace(/-(\d{4})$/, " $1")}</span>
        <span>${hhmm(m.duration)}</span>
        ${m.words ? `<span>${m.words}w</span>` : ""}
      </div>
    </div>`).join("");
  $("#list").querySelectorAll(".item").forEach(el =>
    el.onclick = () => select(el.dataset.id));
}

async function select(id) {
  current = await (await fetch(`/api/meetings/${encodeURIComponent(id)}`)).json();
  if (current.error) return;
  tab = current.notes ? "notes" : "transcript";
  renderList(); renderDetail();
}

function renderDetail() {
  const c = current, b = c.brief, m = c.meta;
  const bits = [b.id, hhmm(b.duration), b.words ? `${b.words} words` : "",
                m.whisper_model ? `whisper ${m.whisper_model}` : "",
                m.ollama_model ? m.ollama_model : ""].filter(Boolean);
  const body = tab === "notes"
    ? (c.notes ? `<div class="notes">${md(c.notes)}</div>`
               : `<div class="empty">No notes yet. <code>verbale notes ${b.id}</code></div>`)
    : (c.segments.length ? c.segments.map(s => `
        <div class="turn">
          <span class="t" data-at="${s.start}">${hhmm(s.start)}</span>
          <span class="who ${s.speaker.toLowerCase() === "you" ? "you" : "them"}">${esc(s.speaker)}</span>
          <span class="txt">${highlight(s.text)}</span>
        </div>`).join("")
      : `<div class="empty">No transcript yet. <code>verbale transcribe ${b.id}</code></div>`);

  $("#detail").innerHTML = `
    <h1>${esc(b.name)}</h1>
    <div class="sub">${bits.map(x => `<span>${esc(String(x))}</span>`).join("")}</div>
    <audio controls preload="none" src="/api/meetings/${encodeURIComponent(b.id)}/them.wav"></audio>
    <div class="tabs">
      <button data-tab="notes" aria-pressed="${tab === "notes"}">Notes</button>
      <button data-tab="transcript" aria-pressed="${tab === "transcript"}">Transcript</button>
    </div>${body}`;

  $("#detail").querySelectorAll("[data-tab]").forEach(b2 =>
    b2.onclick = () => { tab = b2.dataset.tab; renderDetail(); });
  // Clicking a timestamp seeks the recording, which is the whole reason to
  // keep the audio next to the text.
  $("#detail").querySelectorAll("[data-at]").forEach(el => el.onclick = () => {
    const a = $("#detail audio");
    if (a) { a.currentTime = parseFloat(el.dataset.at); a.play(); }
  });
}

$("#q").oninput = e => {
  query = e.target.value.trim();
  if (query && current) { tab = "transcript"; }
  if (current) renderDetail();
};

load();
setInterval(load, 15000);   // pick up meetings recorded while this is open
</script>
</body>
</html>
